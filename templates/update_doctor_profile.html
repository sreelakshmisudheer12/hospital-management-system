{% extends 'base.html' %}

{% block content %}

<div class="register-container">

    <div class="register-card">

        <h2>
            Update Doctor Profile
        </h2>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="register-btn">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
