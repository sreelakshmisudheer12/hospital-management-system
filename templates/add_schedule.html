{% extends 'base.html' %}

{% block content %}

<style>

.schedule-container{
    max-width:700px;
    margin:40px auto;
}

.schedule-card{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.schedule-list{
    margin-top:30px;
}

.schedule-item{
    background:#f3f4f6;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.delete-btn{
    background:#ef4444;
    color:white;
    padding:6px 12px;
    border-radius:6px;
    text-decoration:none;
}

</style>

<div class="schedule-container">

    <div class="schedule-card">

        <h2>Add Schedule</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Day</label>

            <select name="day" required>

                <option value="">Select Day</option>

                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>

            </select>

            <br><br>

            <label>Start Time</label>

            <input
                type="time"
                name="start_time"
                required
            >

            <br><br>

            <label>End Time</label>

            <input
                type="time"
                name="end_time"
                required
            >

            <br><br>

            <button type="submit">
                Add Schedule
            </button>

        </form>

    </div>

    <div class="schedule-list">

        <h3>Your Schedules</h3>

        {% for schedule in schedules %}

            <div class="schedule-item">

                <strong>
                    {{ schedule.day }}
                </strong>

                <br>

                {{ schedule.start_time }}
                -
                {{ schedule.end_time }}

                <br><br>

                <a
                    href="{% url 'delete_schedule' schedule.id %}"
                    class="delete-btn"
                >
                    Delete
                </a>

            </div>

        {% empty %}

            <p>No schedules added.</p>

        {% endfor %}

    </div>

</div>

{% endblock %}
