{% extends 'base.html' %}

{% block content %}

<style>

.feedback-container{
    max-width:600px;
    margin:40px auto;
    padding:20px;
}

.feedback-card{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.feedback-card h2{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.form-group select,
.form-group textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #d1d5db;
}

.submit-btn{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

.submit-btn:hover{
    background:#1d4ed8;
}

</style>

<div class="feedback-container">

    <div class="feedback-card">

        <h2>Give Feedback</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Select Doctor</label>
                <select name="doctor" required>
                    <option value="">-- Choose Doctor --</option>

                    {% for doctor in doctors %}
                        <option value="{{ doctor.id }}">
                            Dr. {{ doctor.user.username }}
                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea name="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Feedback
            </button>
         <p style="text-align:center;color:gray;">
    Logged in as: {{ request.user.username }}
</p>
        </form>

    </div>

</div>

{% endblock %}
